<style>

  .btn {

    flex-direction: column;

  }

  /* Stories Formato 9:16 - 1080 x 1920 */

    height: 1920px;

    overflow: hidden;
    position: relative;

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  async function getJpegDataUrl(elementId) {
    const el = document.getElementById(elementId);
    const originalTransform = el.style.transform;
    el.style.transform = 'none'; // Reseta o scale para captura
    try {
      const canvas = await html2canvas(el, {
        scale: 1, // Renderiza na resolução original 1080x1920
        useCORS: true, // Permite carregar as fontes do Google
        backgroundColor: '#150F0B'
      });
      return canvas.toDataURL('image/jpeg', 0.95);
    } catch (e) {
      console.error('Erro no html2canvas:', e);
      throw e;
    } finally {
      el.style.transform = originalTransform; // Restaura o scale
    }
  }

  async function downloadJpeg(id, fileName) {
    try {
      const dataUrl = await getJpegDataUrl(id);
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = fileName;
      link.click();
    } catch (e) {
      alert('Erro ao gerar imagem: ' + e.message);
    }
  }

  document.getElementById('zipBtn').onclick = async function exportZip() {
    const btn = document.getElementById('zipBtn');
    const oldText = btn.innerText;
    btn.innerText = '⏳ Gerando Arquivo ZIP (Aguarde...)..';
    btn.disabled = true;

    try {
      const ids = [
        ['card-slide-1', '01_destaque_trajetoria.jpg'],
        ['card-slide-2', '02_destaque_concurseiro.jpg'],
        ['card-slide-3', '03_destaque_servidor.jpg'],
        ['card-slide-4', '04_destaque_atendimento.jpg']
      ];

      const zip = new JSZip();
      
      for (let [id, fileName] of ids) {
        const dataUrl = await getJpegDataUrl(id);
        const base64Data = dataUrl.replace(/^data:image\/jpeg;base64,/, '');
        zip.file(fileName, base64Data, { base64: true });
      }

      const content = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = 'destaques_iniciais_ribeiro_rinaldi.zip';
      link.click();
    } catch (e) {
      alert('Erro ao gerar arquivo ZIP: ' + e.message);
    } finally {
      btn.innerText = oldText;
      btn.disabled = false;
    }
  }
</script>
