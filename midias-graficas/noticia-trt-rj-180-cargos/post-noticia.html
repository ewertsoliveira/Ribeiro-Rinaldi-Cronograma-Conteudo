<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Notícia — Câmara aprova 180 cargos no TRT-RJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,800;0,900;1,900&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
  :root {
    --black: #150F0B; --dark-surface: #1E1712; --dark-border: #3A2E24;
    --cream: #F7F1E8; --muted: #A89F91; --orange: #FF5E1A; --magenta: #F0247C; --amber: #D97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: #0E0A07; color: var(--cream); font-family: 'Manrope', sans-serif; padding: 32px; }
  header { max-width: 1400px; margin: 0 auto 32px auto; border-bottom: 1px solid var(--dark-border); padding-bottom: 24px; }
  h1 { font-family: 'Archivo', sans-serif; font-size: 28px; color: var(--cream); letter-spacing: -0.5px; }
  .btn { background: var(--orange); color: #000; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; }
  .btn:hover { background: #FF7338; }
  .grid { display: flex; justify-content: center; max-width: 1400px; margin: 0 auto; }
  .slide-container { background: var(--dark-surface); border: 1px solid var(--dark-border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  .wrapper { width: 432px; height: 540px; position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 16px 32px rgba(0,0,0,0.6); }
  .card-render { width: 1080px; height: 1350px; transform-origin: top left; transform: scale(0.4); position: absolute; top: 0; left: 0; }
  .t-arch { font-family: 'Archivo', sans-serif; font-weight: 900; }
  .t-mono { font-family: 'Space Mono', monospace; font-weight: 700; }
  .t-man { font-family: 'Manrope', sans-serif; font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>Post Notícia — Câmara aprova 180 cargos efetivos no TRT-RJ</h1>
  <p style="color: var(--muted); font-size: 14px; margin-top: 4px;">PL 1.400/2015 · aprovado na Câmara em 01/09/2026 · Formato 4:5 (1080x1350 px)</p>
  <button class="btn" onclick="downloadJpeg('card-1', 'post_noticia_trt_rj_180_cargos.jpg')">📥 Baixar JPEG</button>
</header>

<div class="grid">
  <div class="slide-container">
    <div class="wrapper"><div id="card-1" class="card-render">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
        <defs>
          <clipPath id="photoClip"><rect x="100" y="500" width="880" height="570" rx="20" /></clipPath>
          <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#150F0B" stop-opacity="0"/>
            <stop offset="100%" stop-color="#150F0B" stop-opacity="0.96"/>
          </linearGradient>
        </defs>
        <rect width="1080" height="1350" fill="#150F0B" />

        <rect x="100" y="100" width="330" height="64" rx="10" fill="#FF5E1A" />
        <circle cx="132" cy="132" r="7" fill="#150F0B" />
        <text x="155" y="140" class="t-mono" font-size="24" fill="#150F0B">ÚLTIMA HORA</text>
        <text x="100" y="215" class="t-mono" font-size="21" letter-spacing="1" fill="#A89F91">[ CÂMARA DOS DEPUTADOS · PL 1.400/2015 ]</text>

        <text x="100" y="310" class="t-arch" font-size="56" fill="#F7F1E8">CÂMARA APROVA</text>
        <text x="100" y="380" class="t-arch" font-size="56" fill="#FF5E1A">180 CARGOS NOVOS</text>
        <text x="100" y="450" class="t-arch" font-size="56" fill="#F7F1E8">NO TRT-RJ.</text>

        <g clip-path="url(#photoClip)">
          <image href="../assets/plenario-camara-deputados.jpg" x="100" y="500" width="880" height="570" preserveAspectRatio="xMidYMid slice" />
          <rect x="100" y="500" width="880" height="570" fill="url(#scrim)" />
        </g>
        <text x="960" y="1045" class="t-mono" font-size="14" fill="#F7F1E8" fill-opacity="0.7" text-anchor="end">Foto: Câmara dos Deputados / TV Câmara</text>

        <text x="150" y="950" class="t-man" font-size="27" fill="#F7F1E8">São 24 vagas de juiz do trabalho e 156</text>
        <text x="150" y="988" class="t-man" font-size="27" fill="#F7F1E8">de analista judiciário — o texto segue</text>
        <text x="150" y="1026" class="t-man" font-size="27" fill="#FF5E1A">agora para votação no Senado.</text>

        <text x="100" y="1110" class="t-mono" font-size="24" fill="#FFB347">SALVA ESSE POST PRA NÃO PERDER O EDITAL</text>

        <line x1="100" y1="1150" x2="980" y2="1150" stroke="#3A2E24" stroke-width="2" />
        <polyline points="100,1200 118,1218 150,1180" fill="none" stroke="#FF5E1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="175" y="1205" class="t-arch" font-size="24" fill="#F7F1E8">RIBEIRO RINALDI</text>
        <text x="980" y="1205" class="t-mono" font-size="16" fill="#A89F91" text-anchor="end">ANÁLISE DE NOTÍCIAS · CONCURSO PÚBLICO</text>
        <text x="980" y="1235" class="t-mono" font-size="14" fill="#5C5146" text-anchor="end">FONTE: CÂMARA DOS DEPUTADOS, PL 1.400/2015 · SET/2026</text>
      </svg>
    </div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
  async function downloadJpeg(elementId, fileName) {
    const el = document.getElementById(elementId);
    const originalTransform = el.style.transform;
    el.style.transform = 'none';
    try {
      const dataUrl = await htmlToImage.toJpeg(el, { quality: 0.95, width: 1080, height: 1350, cacheBust: true });
      const link = document.createElement('a');
      link.download = fileName;
      link.href = dataUrl;
      link.click();
    } finally {
      el.style.transform = originalTransform;
    }
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="../instagram_slider.js"></script>
<script src="../overflow-check.js"></script>
</body>
</html>
