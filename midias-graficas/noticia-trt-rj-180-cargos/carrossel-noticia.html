<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  async function downloadJpeg(elementId, fileName) {
    const el = document.getElementById(elementId);
    const originalTransform = el.style.transform;
    el.style.transform = 'none';
    try {
      const dataUrl = await htmlToImage.toJpeg(el, { quality: 0.95, width: 1080, height: 1350, cacheBust: true });
      const link = document.createElement('a');
      link.download = fileName;
      link.href = dataUrl;
      link.click();
    } finally {
      el.style.transform = originalTransform;
    }
  }

  async function getJpegDataUrl(elementId) {
    const el = document.getElementById(elementId);
    const originalTransform = el.style.transform;
    el.style.transform = 'none';
    try {
      return await htmlToImage.toJpeg(el, { quality: 0.95, width: 1080, height: 1350, cacheBust: true });
    } finally {
      el.style.transform = originalTransform;
    }
  }

  async function exportZip() {
    const btn = document.getElementById('zipBtn');
    const oldText = btn.innerText;
    btn.innerText = '⏳ Gerando Arquivo ZIP (Aguarde...)..';
    btn.disabled = true;
    try {
      const ids = [
        ['card-slide-1', '01_trt_rj_capa.jpg'],
        ['card-slide-2', '02_trt_rj_fato.jpg'],
        ['card-slide-3', '03_trt_rj_impacto.jpg'],
        ['card-slide-4', '04_trt_rj_numeros.jpg'],
        ['card-slide-5', '05_trt_rj_cta.jpg']
      ];
      const zip = new JSZip();
      for (let [id, fileName] of ids) {
        const dataUrl = await getJpegDataUrl(id);
        const base64Data = dataUrl.replace(/^data:image\/jpeg;base64,/, '');
        zip.file(fileName, base64Data, { base64: true });
      }
      const content = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = 'carrossel_trt_rj_180_cargos.zip';
      link.click();
    } finally {
      btn.innerText = oldText;
      btn.disabled = false;
    }
  }
</script>
